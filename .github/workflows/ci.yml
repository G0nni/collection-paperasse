name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level high
      - run: pnpm exec playwright install --with-deps chromium
      # Les étapes de `pnpm verify`, séparées pour voir tout de suite laquelle échoue.
      - run: node --version && pnpm --version
      - run: pnpm check
      - run: pnpm lint
      - run: pnpm test
      - name: pnpm build:e2e
        shell: bash
        # En cas d'échec, remonte la fin du journal en annotation (lisible sans télécharger les logs).
        run: |
          set -o pipefail
          if ! pnpm build:e2e 2>&1 | tee build.log; then
            msg=$(tail -n 60 build.log | sed -e 's/%/%25/g' | sed -e ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=pnpm build:e2e::$msg"
            exit 1
          fi
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
